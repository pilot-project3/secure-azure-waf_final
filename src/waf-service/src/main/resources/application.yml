spring:
  application:
    name: waf

  config:
    import: optional:file:.env[.properties]  # .env ?? ????


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    time-zone: Asia/Seoul

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
    org.springframework.web: DEBUG
    com.cupid.qufit: DEBUG

server:
  port: 8081
