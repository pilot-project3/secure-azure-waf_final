plugins {
	id 'java'
	id 'org.springframework.boot' version '2.7.10'
	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.project03.ipservice'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '11'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.postgresql:postgresql'
	implementation 'org.json:json:20231013'
	implementation 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// Azure SDK 의존성
	implementation 'com.azure:azure-identity:1.5.0'
	implementation 'com.azure.resourcemanager:azure-resourcemanager:2.14.0'
	implementation 'com.azure.resourcemanager:azure-resourcemanager-resources:2.14.0'
	implementation 'com.azure:azure-core:1.29.1'
	implementation 'com.azure:azure-core-management:1.7.0'
	implementation 'com.azure:azure-core-http-netty:1.12.0'
	
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

test {
	useJUnitPlatform()
} 